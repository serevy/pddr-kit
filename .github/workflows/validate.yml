name: Validate PDDR Kit

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || format('{0}-{1}', github.ref, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate Skill eval cases
        run: python scripts/validate_skill_evals.py

      - name: Validate Skill consumption cases
        run: python scripts/validate_skill_evals.py evals/pddr-recorder/consumption-cases.json

      - name: Validate Skill correction and approval cases
        run: python scripts/validate_skill_evals.py evals/pddr-recorder/revision-cases.json

      - name: Validate Skill eval results
        run: python scripts/validate_skill_eval_results.py

      - name: Validate repository records
        run: python scripts/pddr.py validate
